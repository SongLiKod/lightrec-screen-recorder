name: Build & Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布 tag（如 v1.2.0）。留空则仅构建并上传 artifact，不创建 Release。'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布（pre-release）'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Qt / MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          dir: 'C:\Qt'
          cache: true

      - name: Setup toolchain PATH
        shell: pwsh
        run: |
          $mingw = Get-ChildItem 'C:\Qt' -Recurse -Filter g++.exe |
            Select-Object -First 1
          if (-not $mingw) { throw 'MinGW g++ was not installed' }
          $mingwBin = $mingw.DirectoryName
          "MINGW_BIN=$mingwBin" >> $env:GITHUB_ENV
          "PATH=$mingwBin;$env:QT_ROOT_DIR\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: Configure tests
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_C_COMPILER="$env:MINGW_BIN\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$env:MINGW_BIN\g++.exe" `
            -DLIGHTREC_BUILD_TESTS=ON

      - name: Build tests
        shell: pwsh
        run: cmake --build build -j 8

      - name: Run tests
        shell: pwsh
        run: |
          $tests = @(
            'LightRecAnnotationTest',
            'LightRecFileDialogTest',
            'LightRecMediaTest',
            'LightRecQrTest',
            'LightRecWatermarkTest',
            'LightRecPreviewDialogTest',
            'LightRecUpdateManagerTest'
          )
          foreach ($test in $tests) {
            Write-Host "Running $test..."
            & ".\build\$test.exe"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

  windows:
    name: Windows (x64)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Qt / MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          dir: 'C:\Qt'
          cache: true

      - name: Setup toolchain PATH
        shell: pwsh
        run: |
          $mingw = Get-ChildItem 'C:\Qt' -Recurse -Filter g++.exe |
            Select-Object -First 1
          if (-not $mingw) { throw 'MinGW g++ was not installed' }
          $mingwBin = $mingw.DirectoryName
          "MINGW_BIN=$mingwBin" >> $env:GITHUB_ENV
          "PATH=$mingwBin;$env:QT_ROOT_DIR\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: Configure release build
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_C_COMPILER="$env:MINGW_BIN\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$env:MINGW_BIN\g++.exe" `
            -DLIGHTREC_BUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build -j 8

      - name: Package
        shell: pwsh
        run: .\scripts\package.ps1 -BuildDir build -Output dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LightRec-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: LightRec-windows
          path: dist-artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRE="false"
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          if [[ "$TAG" == *-* ]]; then
            PRE="true"
          fi
          VERSION="${TAG#v}"
          ZIP="$(find dist-artifacts -name 'LightRec-*-win64.zip' -print -quit)"
          if [[ -z "$ZIP" ]]; then
            echo "::error::Update package was not found"
            exit 1
          fi
          ZIP_VERSION="$(basename "$ZIP" | sed -E 's/^LightRec-(.+)-win64\.zip$/\1/')"
          if [[ "$VERSION" != "$ZIP_VERSION" ]]; then
            echo "::error::Tag version $VERSION does not match package version $ZIP_VERSION"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          ls -lh dist-artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -name 'LightRec-*-win64.zip' -exec cp {} upload/ \;
          ls -lh upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: LightRec ${{ steps.tag.outputs.version }}
          files: upload/*.zip
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
